[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interroai-backend"
version = "0.1.0"
description = "InterroAI backend — the local agent runtime, and the cloud API and indexing worker it talks to"
requires-python = ">=3.11"
license = { text = "MIT" }

# Abstract dependencies — lower bounds only. What every process needs: the web
# framework, settings and model access. The exact, fully pinned and
# hash-verified sets live in the lockfiles generated from this file:
#   requirements.lock        the desktop runtime   uv pip sync requirements.lock
#   requirements-cloud.lock  the cloud images      see Dockerfile
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "keyring>=25.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
# What only the desktop runtime needs: the local index, the chunker and the
# optional cache. The cloud images never install these, and
# tests/test_dependency_split.py fails if cloud code starts to need them.
runtime = [
    "chromadb>=0.5.0",
    "pathspec>=0.12.0",
    "langchain-text-splitters>=0.2.0",
    "redis>=5.0.0",
]
# What only the cloud processes (cloud/api, cloud/worker) need. The runtime on
# a user's machine never imports any of it — tests/test_boundaries.py holds that.
cloud = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "azure-servicebus>=7.14.0",  # 7.14.0 is the first with emulator support
    "azure-storage-blob>=12.20.0",
    "aiohttp>=3.9.0",  # the transport the Azure SDKs' async clients need
    "pyjwt>=2.8.0",
]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "interroai-backend[runtime,cloud]",
]

[project.scripts]
interroai-backend = "main:run"
interroai-worker = "cloud.worker.main:main"

# ── Packaging ────────────────────────────────────────────────────────────────
# Flat layout (main.py + config.py at the root, alongside the api/, agents/,
# contracts/ and core/ packages), so setuptools' auto-discovery is ambiguous
# and we declare the members explicitly.
[tool.setuptools]
packages = [
    "api",
    "agents",
    "cloud",
    "cloud.adapters",
    "cloud.api",
    "cloud.db",
    "cloud.worker",
    "contracts",
    "core",
    "core.index",
    "core.index.adapters",
    "core.local",
    "core.models",
    "core.remote",
    "core.workspace",
]
py-modules = ["main", "config"]

# ── Tooling ──────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A handful of lines inside the embedded system-prompt strings in these two
# files exceed line-length. They cannot carry an inline `# noqa` — a comment
# placed inside a triple-quoted string is not a comment, it is part of the
# string, and would land in what gets sent to the model. Scoped to exactly
# these two files' E501 only: it does not relax any other rule, and a new
# file (or a genuinely-too-long *code* line in either of these two) is still
# held to the full rule set.
"agents/coder.py" = ["E501"]
"agents/session.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The backend is a flat layout imported as `core.*` / `api.*` / `agents.*`,
# so the package root has to be on sys.path for tests to import it.
pythonpath = ["."]
# Integration tests need the docker compose stack; the default run stays
# offline. Run them with:  pytest -m integration
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs the local stack from docker-compose.yml (Postgres, Azurite, Service Bus emulator)",
]

[tool.coverage.run]
source = ["api", "agents", "cloud", "contracts", "core"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
