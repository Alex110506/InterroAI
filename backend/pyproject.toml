[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interroai-backend"
version = "0.1.0"
description = "FastAPI orchestrator for InterroAI — a local desktop AI multi-agent coding platform"
requires-python = ">=3.11"
license = { text = "MIT" }

# Abstract dependencies — lower bounds only. The exact, fully-pinned and
# hash-verified set lives in requirements.lock (generated from this file).
# Install reproducibly with:  uv pip sync requirements.lock
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "keyring>=25.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "chromadb>=0.5.0",
    "pathspec>=0.12.0",
    "langchain-text-splitters>=0.2.0",
    "tenacity>=8.2.0",
    "redis>=5.0.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
interroai = "cli.main:main"
interroai-backend = "main:run"

# ── Packaging ────────────────────────────────────────────────────────────────
# Flat layout (main.py + config.py at the root, alongside the api/, agents/,
# cli/ and core/ packages), so setuptools' auto-discovery is ambiguous and we
# declare the members explicitly.
[tool.setuptools]
packages = ["api", "agents", "cli", "core"]
py-modules = ["main", "config"]

# ── Tooling ──────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The backend is a flat layout imported as `core.*` / `api.*` / `agents.*`,
# so the package root has to be on sys.path for tests to import it.
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["api", "agents", "cli", "core"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
