# Alembic configuration for the cloud database. From backend/:
#
#   alembic -c cloud/alembic.ini upgrade head          apply
#   alembic -c cloud/alembic.ini upgrade head --sql    print the SQL, touch nothing
#
# The connection string is never kept in this file: migrations/env.py reads
# INTERROAI_MIGRATIONS_DATABASE_URL (the owner role) from the environment or .env.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
