<svg width="100%" viewBox="0 0 840 970" role="img" xmlns="http://www.w3.org/2000/svg">
  <title style="font-family: system-ui, sans-serif;">InterroAI Cloud Architecture - Azure, Local Execution</title>
  <desc style="font-family: system-ui, sans-serif;">Architecture diagram for InterroAI on Azure. The agent loop and its file tools run on the user's machine inside a local Python runtime driven by the Electron app. The runtime calls a FastAPI Web API on Azure Container Apps for GitHub OAuth sessions, the LLM gateway, semantic search and project sync, and uploads changed chunks straight to Blob Storage with a SAS URL. The Web API enqueues index jobs on Service Bus; an Embed Worker on Container Apps consumes them, embeds chunks with OpenAI, and upserts vectors into PostgreSQL with pgvector. The cloud stores vectors, paths, line ranges and file hashes, never code text.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Opaque canvas: without it, viewers with a dark theme show the free-standing labels on a dark ground -->
  <rect x="0" y="0" width="840" height="970" fill="#ffffff"/>

  <!-- ================= EXTERNAL SERVICES ================= -->
  <g>
    <!-- GitHub OAuth -->
    <rect x="60" y="20" width="180" height="56" rx="8" fill="#fcfcfb" stroke="#e5e5e5" stroke-width="1"/>
    <text x="150" y="38" text-anchor="middle" dominant-baseline="central" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">GitHub OAuth App</text>
    <text x="150" y="58" text-anchor="middle" dominant-baseline="central" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">Identity only · read:user</text>

    <!-- OpenAI API -->
    <rect x="330" y="20" width="180" height="56" rx="8" fill="#fcfcfb" stroke="#e5e5e5" stroke-width="1"/>
    <text x="420" y="38" text-anchor="middle" dominant-baseline="central" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">OpenAI API</text>
    <text x="420" y="58" text-anchor="middle" dominant-baseline="central" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">Platform key · chat · embeddings</text>

    <!-- CI/CD -->
    <rect x="600" y="20" width="180" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="690" y="38" text-anchor="middle" dominant-baseline="central" style="fill:#334155; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">GitHub Actions</text>
    <text x="690" y="58" text-anchor="middle" dominant-baseline="central" style="fill:#475569; font-family: system-ui, sans-serif; font-size: 12px;">Lint · test · GHCR images</text>
  </g>

  <!-- ================= AZURE RESOURCE GROUP ================= -->
  <rect x="20" y="110" width="800" height="575" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="800" y="150" text-anchor="end" style="fill:#475569; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600;">Azure · rg-interroai</text>

  <!-- Connections: Azure to External -->
  <line x1="150" y1="170" x2="150" y2="80" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="158" y="100" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">Code exchange</text>

  <line x1="260" y1="170" x2="370" y2="80" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="305" y="128" text-anchor="end" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">Chat + query embed</text>

  <line x1="580" y1="170" x2="470" y2="80" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="537" y="128" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">Embeddings</text>

  <line x1="690" y1="80" x2="690" y2="106" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="698" y="96" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">Deploy (OIDC)</text>

  <g>
    <!-- 1. Web API Node -->
    <rect x="40" y="170" width="250" height="285" rx="12" fill="#fafafa" stroke="#d4d4d8" stroke-width="1"/>
    <text x="165" y="195" text-anchor="middle" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Web API · Container App</text>

    <rect x="55" y="215" width="220" height="50" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
    <text x="165" y="232" text-anchor="middle" dominant-baseline="central" style="fill:#3c3489; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Auth &amp; Sessions</text>
    <text x="165" y="250" text-anchor="middle" dominant-baseline="central" style="fill:#534ab7; font-family: system-ui, sans-serif; font-size: 12px;">GitHub OAuth → JWT</text>

    <rect x="55" y="275" width="220" height="50" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
    <text x="165" y="292" text-anchor="middle" dominant-baseline="central" style="fill:#3c3489; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Projects &amp; Sync</text>
    <text x="165" y="310" text-anchor="middle" dominant-baseline="central" style="fill:#534ab7; font-family: system-ui, sans-serif; font-size: 12px;">Manifest diff · SAS URLs</text>

    <rect x="55" y="335" width="220" height="50" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
    <text x="165" y="352" text-anchor="middle" dominant-baseline="central" style="fill:#3c3489; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">LLM Gateway</text>
    <text x="165" y="370" text-anchor="middle" dominant-baseline="central" style="fill:#534ab7; font-family: system-ui, sans-serif; font-size: 12px;">SSE stream · per-user quotas</text>

    <rect x="55" y="395" width="220" height="50" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="1"/>
    <text x="165" y="412" text-anchor="middle" dominant-baseline="central" style="fill:#3c3489; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Search &amp; Jobs</text>
    <text x="165" y="430" text-anchor="middle" dominant-baseline="central" style="fill:#534ab7; font-family: system-ui, sans-serif; font-size: 12px;">pgvector query · job progress</text>

    <!-- 2. Service Bus -->
    <rect x="360" y="240" width="120" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="420" y="280" text-anchor="middle" dominant-baseline="central" style="fill:#b45309; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600;">Service Bus</text>
    <text x="420" y="305" text-anchor="middle" dominant-baseline="central" style="fill:#d97706; font-family: system-ui, sans-serif; font-size: 12px;">Basic tier</text>
    <text x="420" y="325" text-anchor="middle" dominant-baseline="central" style="fill:#d97706; font-family: system-ui, sans-serif; font-size: 12px;">index-jobs</text>
    <text x="420" y="345" text-anchor="middle" dominant-baseline="central" style="fill:#d97706; font-family: system-ui, sans-serif; font-size: 12px;">+ dead-letter</text>

    <!-- 3. Embed Worker Node -->
    <rect x="550" y="170" width="250" height="285" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="1"/>
    <text x="675" y="195" text-anchor="middle" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Embed Worker · Container App</text>

    <rect x="565" y="215" width="220" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
    <text x="675" y="232" text-anchor="middle" dominant-baseline="central" style="fill:#166534; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Queue Consumer</text>
    <text x="675" y="250" text-anchor="middle" dominant-baseline="central" style="fill:#15803d; font-family: system-ui, sans-serif; font-size: 12px;">KEDA scale · 0 → 2 replicas</text>

    <rect x="565" y="275" width="220" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
    <text x="675" y="292" text-anchor="middle" dominant-baseline="central" style="fill:#166534; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Embed Batches</text>
    <text x="675" y="310" text-anchor="middle" dominant-baseline="central" style="fill:#15803d; font-family: system-ui, sans-serif; font-size: 12px;">Hash cache · bisect bad chunks</text>

    <rect x="565" y="335" width="220" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
    <text x="675" y="352" text-anchor="middle" dominant-baseline="central" style="fill:#166534; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Upsert &amp; Prune</text>
    <text x="675" y="370" text-anchor="middle" dominant-baseline="central" style="fill:#15803d; font-family: system-ui, sans-serif; font-size: 12px;">Overwrite changed · drop deleted</text>

    <rect x="565" y="395" width="220" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
    <text x="675" y="412" text-anchor="middle" dominant-baseline="central" style="fill:#166534; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Report Progress</text>
    <text x="675" y="430" text-anchor="middle" dominant-baseline="central" style="fill:#15803d; font-family: system-ui, sans-serif; font-size: 12px;">Job row · LISTEN/NOTIFY</text>
  </g>

  <!-- Queue Connections -->
  <line x1="290" y1="300" x2="355" y2="300" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="322" y="288" text-anchor="middle" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">Enqueue</text>

  <line x1="480" y1="300" x2="545" y2="300" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="512" y="288" text-anchor="middle" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">Deliver</text>

  <!-- ================= DATA LAYER ================= -->
  <g>
    <!-- PostgreSQL + pgvector -->
    <rect x="320" y="495" width="200" height="90" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
    <text x="420" y="513" text-anchor="middle" dominant-baseline="central" style="fill:#085041; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">PostgreSQL + pgvector</text>
    <text x="420" y="535" text-anchor="middle" dominant-baseline="central" style="fill:#0f6e56; font-family: system-ui, sans-serif; font-size: 12px;">Flexible Server · B1ms</text>
    <text x="420" y="553" text-anchor="middle" dominant-baseline="central" style="fill:#0f6e56; font-family: system-ui, sans-serif; font-size: 12px;">Users · projects · jobs</text>
    <text x="420" y="571" text-anchor="middle" dominant-baseline="central" style="fill:#0f6e56; font-family: system-ui, sans-serif; font-size: 12px;">Vectors + line ranges, no code</text>

    <!-- Blob Storage -->
    <rect x="550" y="495" width="250" height="90" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="675" y="517" text-anchor="middle" dominant-baseline="central" style="fill:#0369a1; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Blob Storage</text>
    <text x="675" y="541" text-anchor="middle" dominant-baseline="central" style="fill:#0284c7; font-family: system-ui, sans-serif; font-size: 12px;">Chunk uploads (JSONL)</text>
    <text x="675" y="561" text-anchor="middle" dominant-baseline="central" style="fill:#0284c7; font-family: system-ui, sans-serif; font-size: 12px;">Deleted after embed · 1-day TTL</text>

    <!-- Platform services -->
    <rect x="320" y="605" width="200" height="62" rx="8" fill="#fcfcfb" stroke="#e5e5e5" stroke-width="1"/>
    <text x="420" y="622" text-anchor="middle" dominant-baseline="central" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Key Vault · App Insights</text>
    <text x="420" y="641" text-anchor="middle" dominant-baseline="central" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">Managed Identity secrets</text>
    <text x="420" y="657" text-anchor="middle" dominant-baseline="central" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">OpenTelemetry traces</text>
  </g>

  <!-- Data Connections -->
  <line x1="250" y1="455" x2="370" y2="491" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="300" y="487" text-anchor="end" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">SQL · vector search</text>

  <line x1="590" y1="455" x2="470" y2="491" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="545" y="487" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">Write + delete, 1 txn</text>

  <line x1="720" y1="455" x2="720" y2="491" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="728" y="477" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">Read · delete</text>

  <!-- ================= USER MACHINE ================= -->
  <!-- Connection: Runtime to Web API -->
  <line x1="125" y1="765" x2="125" y2="460" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="133" y="600" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">HTTPS + JWT</text>
  <text x="133" y="618" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">LLM · search · sync</text>

  <!-- Connection: Runtime uploads chunks to Blob -->
  <line x1="470" y1="765" x2="640" y2="590" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="560" y="710" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">Upload chunks (SAS URL)</text>

  <rect x="20" y="725" width="800" height="180" rx="16" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="800" y="750" text-anchor="end" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">User Machine</text>

  <g>
    <!-- Local Agent Runtime -->
    <rect x="40" y="765" width="480" height="120" rx="12" fill="#fafafa" stroke="#d4d4d8" stroke-width="1"/>
    <text x="280" y="787" text-anchor="middle" style="fill:#111; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Local Agent Runtime · Python</text>

    <rect x="55" y="805" width="140" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="125" y="825" text-anchor="middle" dominant-baseline="central" style="fill:#1d4ed8; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Agent Loop</text>
    <text x="125" y="845" text-anchor="middle" dominant-baseline="central" style="fill:#2563eb; font-family: system-ui, sans-serif; font-size: 12px;">Plan · code · verify</text>

    <rect x="210" y="805" width="140" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="280" y="825" text-anchor="middle" dominant-baseline="central" style="fill:#1d4ed8; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Local Tools</text>
    <text x="280" y="845" text-anchor="middle" dominant-baseline="central" style="fill:#2563eb; font-family: system-ui, sans-serif; font-size: 12px;">Read · patch · pytest</text>

    <rect x="365" y="805" width="140" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="435" y="825" text-anchor="middle" dominant-baseline="central" style="fill:#1d4ed8; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Sync &amp; Chunker</text>
    <text x="435" y="845" text-anchor="middle" dominant-baseline="central" style="fill:#2563eb; font-family: system-ui, sans-serif; font-size: 12px;">Hash · diff · chunk</text>

    <!-- Electron App -->
    <rect x="550" y="765" width="250" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
    <text x="675" y="797" text-anchor="middle" dominant-baseline="central" style="fill:#9a3412; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 500;">Electron App</text>
    <text x="675" y="822" text-anchor="middle" dominant-baseline="central" style="fill:#c2410c; font-family: system-ui, sans-serif; font-size: 12px;">React UI · diff review</text>
    <text x="675" y="842" text-anchor="middle" dominant-baseline="central" style="fill:#c2410c; font-family: system-ui, sans-serif; font-size: 12px;">GitHub login in system browser</text>
    <text x="675" y="862" text-anchor="middle" dominant-baseline="central" style="fill:#c2410c; font-family: system-ui, sans-serif; font-size: 12px;">JWT in safeStorage</text>
  </g>

  <!-- Connection: Electron <-> Runtime -->
  <line x1="547" y1="825" x2="523" y2="825" marker-start="url(#arrow)" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
  <text x="535" y="815" text-anchor="middle" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 10px;">IPC</text>

  <!-- ================= FOOTNOTE ================= -->
  <text x="420" y="932" text-anchor="middle" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">Search returns path + line range + file_hash; the runtime reads the code from local disk.</text>
  <text x="420" y="952" text-anchor="middle" style="fill:#52514e; font-family: system-ui, sans-serif; font-size: 12px;">Upsert &amp; Prune: overwrite chunks of changed files, delete chunks of removed files or lines, all in one transaction.</text>

</svg>
